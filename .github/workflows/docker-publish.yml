name: Docker Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Permissões necessárias para a action criar a tag no repositório
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para calcular a versão corretamente

      # 1. Gera a próxima tag automaticamente
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Incrementa o último número (v1.0.x) por padrão

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/image-collor
          tags: |
            # Usa a tag gerada no passo anterior
            type=raw,value=${{ steps.tag_version.outputs.new_tag }}
            latest

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tag_version.outputs.new_tag }}

      - name: Update Kubernetes manifests in k8s-workflow repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/image-collor
          IMAGE_NAME: jldevops01/image-collor 
        run: |
          # Clona o repositório de manifestos
          git clone https://x-access-token:${PAT_TOKEN}@github.com/jorgetrc/k8s-workflow.git
          cd k8s-workflow
          
          # Configura o git
          git config user.name "GitHub Actions CI"
          git config user.email "actions@github.com"
          
          # Navega até a pasta base e atualiza a imagem com Kustomize
          cd base
          
          # Atualiza a tag no kustomization.yml da base
          kustomize edit set image ${IMAGE_NAME}=${IMAGE_NAME}:${NEW_TAG}
          
          # Comita e faz o push
          git commit -am "chore: update image tag to ${NEW_TAG}"
          git push origin main